<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Di Balik Layar: Pilihanmu Menentukan</title>
    <!-- Menghubungkan file CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- Header & Status Empati -->
        <header>
            <h1>Di Balik Layar</h1>
            <p class="subtitle">Sebuah Cerita Interaktif Anti-Bullying</p>
            <div class="status-bar">
                <span>Poin Empati: <strong id="empathy-score">50</strong></span>
            </div>
        </header>

        <!-- Area Konten Cerita -->
        <main>
            <div id="story-box">
                <p id="story-text">Memuat cerita...</p>
            </div>

            <!-- Area Tombol Pilihan -->
            <div id="choices-box">
                <!-- Tombol pilihan akan dimasukkan secara otomatis oleh JavaScript -->
            </div>
        </main>
    </div>

    <!-- Menghubungkan file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
